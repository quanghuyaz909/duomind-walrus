<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeMind</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f14; color: #e6edf3;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid #1f2933;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header span { font-size: 12px; color: #8b949e; }
  #log {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 640px; padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1f6feb; color: white; }
  .bot { align-self: flex-start; background: #161b22; border: 1px solid #1f2933; }
  .bot.pending { color: #8b949e; font-style: italic; }
  form { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #1f2933; }
  input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #1f2933;
    background: #0d1117; color: #e6edf3; font-size: 14px;
  }
  button {
    padding: 12px 18px; border-radius: 8px; border: none;
    background: #1f6feb; color: white; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>TradeMind</h1>
  <span>crypto trading journal &middot; remembers you on Walrus Memory</span>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Tell me about a trade, your strategy, risk tolerance..." />
  <button id="send">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function getUserId() {
    let id = null;
    try { id = localStorage.getItem("trademind-user-id"); } catch (e) {}
    if (!id) {
      id = "web-" + crypto.randomUUID();
      try { localStorage.setItem("trademind-user-id", id); } catch (e) {}
    }
    return id;
  }
  const userId = getUserId();

  function addMessage(text, role) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  addMessage("Tell me about your trades, strategy, or watchlist — I'll remember it across sessions, permanently, on Walrus.", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    addMessage(text, "user");
    const pending = addMessage("thinking...", "bot pending");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, message: text }),
      });
      const data = await res.json();
      pending.textContent = data.reply || data.error || "(no response)";
      pending.classList.remove("pending");
    } catch (err) {
      pending.textContent = "Network error, try again.";
      pending.classList.remove("pending");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
